<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Coach Dani · Sesión</title>
<style>
:root{
  --bg:#0F1B21; --panel:#16262E; --panel-2:#1C303A; --line:#2A424E;
  --ink:#E9F0F2; --ink-2:#8FA6AE; --ink-3:#5C737C;
  --agua:#3EC9D9; --agua-dk:#0E7B88; --carga:#F2A93B; --ok:#5BC978; --alerta:#E86A5C;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);max-width:520px;margin:0 auto;min-height:100vh;padding:18px 16px 40px;line-height:1.45}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--agua)}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:2px 0 4px}
h2{font-size:18px;font-weight:800;margin:0 0 10px}
.sub{font-size:13px;color:var(--ink-2);margin-bottom:18px}
.grid{display:grid;gap:10px}
.opt{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .15s}
.opt:active{border-color:var(--agua)}
.opt .t{font-size:16px;font-weight:800}
.opt .d{font-size:12px;color:var(--ink-2);margin-top:3px}
.opt.sel{border-color:var(--agua);background:var(--panel-2)}
.row{display:flex;gap:10px}
.row .opt{flex:1;text-align:center}
.btn{display:block;width:100%;background:var(--agua);color:#06272C;border:none;border-radius:var(--r);padding:15px;font-size:15px;font-weight:800;cursor:pointer;margin-top:16px}
.btn.ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line);font-weight:600}
.btn:disabled{opacity:.35}
.back{background:none;border:none;color:var(--ink-3);font-size:13px;font-weight:700;cursor:pointer;padding:0;margin-bottom:14px}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:6px;background:var(--panel-2);color:var(--agua);border:1px solid var(--line);margin-right:6px}
.chip.carga{color:var(--carga)}
.chip.rodilla{color:var(--alerta)}
/* Tarjeta ejercicio */
.excard{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exname{font-size:17px;font-weight:800}
.exmeta{font-size:12px;color:var(--ink-2);margin-top:2px}
.fig{background:var(--panel-2);border-radius:10px;margin:12px 0;padding:6px;display:flex;justify-content:center}
.fig svg{width:100%;max-width:280px;height:auto}
.fig .fA,.fig .fB{stroke:var(--ink);stroke-width:4;stroke-linecap:round;fill:none}
.fig circle.h{fill:var(--ink);stroke:none}
.fig .lb{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;fill:none}
.fig .jt{fill:var(--agua);stroke:#0E7B88;stroke-width:.5;r:2.8}
.fig .wt{fill:var(--carga)}
.fig .acc{stroke:var(--carga)}
.fig .fA{animation:swapA 2s infinite}
.fig .fB{animation:swapB 2s infinite;opacity:0}
@keyframes swapA{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
@keyframes swapB{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.fig .fA{animation:none}.fig .fB{animation:none;opacity:0}}
.series{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.serie{flex:1;min-width:60px;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:12px 0;text-align:center;font-weight:800;font-size:14px;color:var(--ink-2);cursor:pointer}
.serie.done{background:var(--agua-dk);border-color:var(--agua);color:#fff}
.reco{font-size:12.5px;color:var(--carga);margin-top:8px;font-weight:600}
.reco.none{color:var(--ink-3);font-weight:400}
.linkalt{background:none;border:none;color:var(--agua);font-size:12.5px;font-weight:700;cursor:pointer;padding:0;margin-top:10px}
/* Timer descanso */
.timerwrap{position:fixed;inset:0;background:rgba(6,17,21,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50}
.timer{font-size:88px;font-weight:800;letter-spacing:-2px;color:var(--agua);font-variant-numeric:tabular-nums}
.timerlbl{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.timerskip{margin-top:26px;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 28px;font-weight:700;cursor:pointer}
/* Modal log */
.modal{position:fixed;inset:0;background:rgba(6,17,21,.9);display:flex;align-items:flex-end;z-index:60}
.sheet{background:var(--panel);border-radius:20px 20px 0 0;padding:22px 18px 30px;width:100%;max-width:520px;margin:0 auto}
.sheet input{width:100%;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;color:var(--ink);font-size:20px;font-weight:800;padding:12px;text-align:center;margin:8px 0 14px}
.feel{display:flex;gap:8px}
.feel button{flex:1;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:12px 0;font-size:20px;cursor:pointer}
.feel button.sel{border-color:var(--carga);background:#3a2d14}
.lbl{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3)}
.progress{height:5px;background:var(--panel-2);border-radius:3px;margin:14px 0 18px;overflow:hidden}
.progress div{height:100%;background:var(--agua);border-radius:3px;transition:width .3s}
.dots{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 10px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:all .2s}
.dot.done{background:var(--agua);border-color:var(--agua)}
.dot.now{border-color:var(--carga);background:var(--carga);box-shadow:0 0 0 4px rgba(242,169,59,.2)}
.done-card{text-align:center;padding:40px 10px}
.done-card .big{font-size:52px}
.hist{font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
.footer-note{font-size:11.5px;color:var(--ink-3);margin-top:20px;text-align:center}
.demobar{background:var(--panel-2);border:1px solid var(--carga);border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--ink-2);margin-bottom:16px;cursor:pointer;line-height:1.5}
</style>
</head>

press_banca:{n:"Press Banca (velocidad)",svg:"press_banca",tip:"Con tu barra de 21 kg: baja 2\u2033 controlado, pausa 1\u2033 en el pecho, sube LO MÁS RÁPIDO posible. La intención de velocidad convierte carga liviana en potencia real.",peso:true,alt:["flexiones","press_manc"],chips:["carga"]},
push_press:{n:"Push Press (barra)",svg:"press_militar",tip:"Barra al pecho, leve impulso de piernas (flexión mínima) + empuje EXPLOSIVO sobre la cabeza. Transferencia cadera→brazos en versión casa. Rodilla-amigable.",peso:true,alt:["press_militar","arnold"],chips:["carga","surf"]},
remo_polea:{n:"Remo en Polea",svg:"remo_polea",tip:"Tira hacia el abdomen, codos pegados. No balancees el tronco.",peso:true,alt:["remo_banda"],chips:["carga"]},
press_militar:{n:"Press Militar",svg:"press_militar",tip:"De pie o sentado. Sube sobre la cabeza sin arquear la lumbar.",peso:true,alt:["press_banca"],chips:["carga"]},
curl:{n:"Curl Bíceps",svg:"curl",tip:"Codos fijos al costado. Sin impulso. En casa: Par A.",peso:true,par:"A",alt:["remo_banda"],chips:[]},
triceps:{n:"Tríceps en Polea",svg:"triceps",tip:"Codos fijos, extiende completo abajo.",peso:true,alt:["flexiones"],chips:[]},
pallof:{n:"Pallof Press",svg:"pallof",tip:"Banda o polea lateral. Extiende brazos al frente resistiendo la rotación. Core surf.",peso:false,rep:"10 por lado",alt:["plancha_alc"],chips:["surf"]},
plancha_alc:{n:"Plancha con Alcance",svg:"plancha_alc",tip:"Plancha alta, extiende un brazo al frente sin rotar la cadera. Alterna.",peso:false,rep:"8 por lado",alt:["dead_bug"],chips:["surf"]},
dead_bug:{n:"Dead Bug",svg:"dead_bug",tip:"Lumbar pegada al suelo. Extiende brazo y pierna contrarios, lento.",peso:false,rep:"10 por lado, lento",alt:["plancha_alc"],chips:["surf"]},
burpee_np:{n:"Burpee sin Salto",svg:"burpee_np",tip:"Paso atrás a plancha (no salto), vuelve y ponte de pie. Patrón pop-up surf.",peso:false,rep:"10 reps",alt:["flexiones"],chips:["surf","rodilla"]},
flexiones:{n:"Flexiones (push-up)",svg:"flexiones",tip:"Cuerpo recto como tabla, manos bajo los hombros. Baja el pecho cerca del suelo doblando los codos, sube completo. Pecho, hombro frontal y tríceps.",peso:false,rep:"al fallo −2",alt:["pike_pushup","press_banca"],chips:[]},
pike_pushup:{n:"Pike Push-up (flexión en V)",svg:"pike_pushup",tip:"Cadera arriba formando una V invertida (como perro boca abajo). Baja la cabeza hacia el suelo entre las manos doblando codos. Ataca el deltoides (hombro), no el pecho. Alternativa vertical a la flexión.",peso:false,rep:"al fallo −2",alt:["flexiones"],chips:["surf"]},
remo_banda:{n:"Remo con Banda",svg:"remo_banda",tip:"Banda anclada. Tira al abdomen, aprieta espalda.",peso:false,alt:["remo_polea"],chips:[]},
puente:{n:"Puente de Glúteo con Disco",svg:"puente",tip:"Disco sobre la cadera. Sube vértebra a vértebra, aprieta 1\u2033 arriba. Tu hip thrust de casa.",peso:true,alt:["hip_thrust"],chips:["rodilla","carga"]},
pull_up:{n:"Dominadas (Pull-up)",svg:"pull_up",tip:"Agarre firme, pecho a la barra. Si no salen completas: negativas lentas (salta arriba, baja en 4\u2033).",peso:false,rep:"al fallo −1",alt:["remo_banda"],chips:[]},
press_manc:{n:"Press con Mancuernas",svg:"press_banca",tip:"En banco, con Par B (pesado, 15 kg c/u = 30 kg). Baja controlado, sube junto. Tu press pesado de casa.",peso:true,par:"B",alt:["flexiones","press_banca"],chips:["carga"]},
femoral:{n:"Curl Femoral en Banca",svg:"femoral",tip:"Boca abajo o sentado, talones bajo el rodillo. Flecta llevando talones al glúteo, baja lento. Isquios sin cargar la rótula. NO uses la extensión de cuádriceps.",peso:true,alt:["rdl","puente"],chips:["rodilla","carga"]},
eliptica:{n:"Elíptica — Intervalo",svg:"eliptica",tip:"Cero impacto, ideal rodilla. Ritmo fuerte 40\u2033 / suave 80\u2033.",peso:false,rep:"40\u2033 fuerte + 80\u2033 suave",alt:["bici"],chips:["rodilla"]},
bici:{n:"Bici — Intervalo",svg:"bici",tip:"Cadencia alta 100+ rpm, resistencia moderada. NUNCA pesado a cadencia baja.",peso:false,rep:"30\u2033 fuerte + 90\u2033 suave",alt:["remo_polea"],chips:["rodilla"]},
farmer:{n:"Farmer Carry",svg:"farmer",tip:"Mancuernas pesadas a los costados. Camina erguido 20–30 m.",peso:true,alt:["hip_thrust"],chips:["carga"]},
/* Iron Belt — core golf·surf·snowboard (gym) */
ib_deadbug90:{n:"90/90 Dead Bug + Press Pared",svg:"dead_bug",tip:"Boca arriba junto a la pared, caderas y rodillas a 90°, palmas EMPUJANDO la pared fuerte (costillas abajo, ombligo a la columna). Baja pierna contraria lenta sin despegar lumbar. El press a la pared enciende el TrA.",peso:false,rep:"3×10 por lado",alt:[],chips:["surf","golf"]},
ib_rkc:{n:"RKC Plank",svg:"plancha_alc",tip:"Plancha corta de MÁXIMA tensión: aprieta glúteos con todo, tira codos hacia pies sin moverte, cuerpo un solo bloque. 20\u2033 de tensión total valen más que 2\u2032 flojos.",peso:false,rep:"3×20\u2033",alt:[],chips:[]},
ib_birddog:{n:"Bird-Dog Row (banco)",svg:"ib_birddog",tip:"Rodilla y mano en banco, pierna contraria extendida: rema la mancuerna SIN que la cadera rote un milímetro. Caderas perfectamente niveladas — eso ES el ejercicio.",peso:true,rep:"3×10 por lado",alt:[],chips:["surf"]},
ib_sideplank:{n:"Side Plank + Abducción",svg:"ib_sideplank",tip:"Plancha lateral firme y la pierna de arriba sube y baja controlada. Glúteo medio + core lateral integrados — el control de canto en la tabla y la estabilidad del swing.",peso:false,rep:"3×8 por lado",alt:[],chips:["snow","golf"]},
ib_pallofk:{n:"Tall Kneeling Pallof",svg:"pallof",tip:"De rodillas altas (glúteos apretados), extiende cable/banda al frente y RESISTE la rotación. Imita el top del backswing. Ni un grado de giro.",peso:true,rep:"3×12",alt:["pallof"],chips:["golf"]},
ib_stirpot:{n:"Stir the Pot (fitball)",svg:"ib_stirpot",tip:"Plancha con antebrazos sobre fitball: revuelve la olla en círculos pequeños. Caderas QUIETAS — solo los brazos dibujan el círculo.",peso:false,rep:"3×10 círculos por lado",alt:["plancha_alc"],chips:[]},
ib_slam:{n:"Rotational Med Ball Slam",svg:"ib_slam",tip:"Balón medicinal: rota y AZOTA al suelo desde la cadera. El chasquido viene del core, no de los brazos. Potencia rotacional pura.",peso:true,rep:"3×8 por lado",alt:[],chips:["surf","golf"]},
ib_rdl1:{n:"RDL 1 Pierna → Press Arriba",svg:"ib_rdl",tip:"Bisagra a una pierna con mancuerna, y al subir conecta directo en press sobre la cabeza. Estabilidad en múltiples planos. ⚠️ Rodilla: apoyo estable, peso moderado.",peso:true,rep:"3×10 por lado",alt:[],chips:["surf","snow"]},
ib_wood:{n:"Woodchoppers Alto→Bajo",svg:"ib_wood",tip:"Cable o mancuerna de arriba-afuera hacia abajo-cruzado: leña. La potencia sale de caderas + core bloqueado JUNTOS; los brazos solo guían.",peso:true,rep:"3×15",alt:[],chips:["golf","snow"]},
/* Drenaje linfático-abdominal — rutina 12 min */
dr_psoas:{n:"Apertura Psoas y Flexores",svg:"st_psoas",tip:"Zancada de rodilla al suelo, pelvis adelante, brazo del mismo lado estirado arriba. Estírate HACIA ARRIBA y siente la apertura del frente de la cadera. Respira ahí.",peso:false,rep:"60\u2033 por lado",alt:[],chips:[]},
dr_lumbar:{n:"Descompresión Lumbar en V",svg:"st_rodpecho",tip:"Acostado, rodillas al pecho abrazadas, balancéate suave adelante-atrás y a los lados. Libera la tensión de la espalda baja — sin forzar, es un mecido.",peso:false,rep:"2\u2032",alt:[],chips:[]},
dr_deadbug:{n:"Dead Bug Controlado",svg:"dead_bug",tip:"Boca arriba, brazo y pierna CONTRARIOS bajan lento y alternado, lumbar pegada al suelo. Movimiento cruzado lento — activa el core profundo y bombea el sistema linfático.",peso:false,rep:"2\u2032 alternando",alt:[],chips:[]},
dr_giros:{n:"Giros de Tronco Sentado",svg:"st_giro",tip:"Sentado, gira el tronco a un lado y sostén 3 respiraciones, vuelve y al otro. Es un masaje rítmico de los órganos — lento y con respiración.",peso:false,rep:"90\u2033",alt:[],chips:[]},
dr_puente:{n:"Puente de Glúteo Dinámico",svg:"hip_thrust",tip:"Sube el puente vértebra por vértebra, sostén 2\u2033 arriba apretando glúteo, baja igual de lento vértebra por vértebra. Sin prisa — la bajada ES el ejercicio.",peso:false,rep:"90\u2033 (8-10 subidas)",alt:[],chips:[]},
dr_vacio:{n:"Respiración de Vacío",svg:"st_gato",tip:"En cuatro apoyos o de pie: exhala TODO, y sin inhalar lleva el ombligo hacia la columna, sostén 8-12\u2033, suelta e inhala. 5-6 ciclos. Si estás recién operada de algo o embarazada: omite este bloque.",peso:false,rep:"3\u2032 (5-6 ciclos)",alt:[],chips:[]},
/* Safari de Movimiento — post @tobias.bolliger */
sf_gorila:{n:"1 · Gorilla Walks",svg:"sf_gorila",tip:"Cuclillas profundas, manos al suelo adelante, avanza como gorila. TRABAJA: movilidad de hombro y cadera. Niños: \u0027pisa fuerte como gorila y golpea el pecho al llegar\u0027. ⚠️ Rodilla: profundidad solo hasta donde no moleste.",peso:false,rep:"2-3 cruces",alt:[],chips:[]},
sf_escorpion:{n:"2 · Scorpion Walks",svg:"sf_escorpion",tip:"Desde plancha, una pierna sube doblada por atrás como cola de escorpión, alterna caminando. TRABAJA: estabilidad y elasticidad del core. Lento y controlado — la cola pica despacio.",peso:false,rep:"6-8 pasos por lado",alt:[],chips:[]},
sf_lagarto:{n:"3 · Lizard Crawl",svg:"sf_lagarto",tip:"Arrastre bajo, pecho cerca del suelo, codos y rodillas doblados avanzando en diagonal. TRABAJA: fuerza, coordinación y control — el más exigente del safari. Niños: \u0027pasa bajo la reja sin que te vean\u0027.",peso:false,rep:"2 cruces cortos",alt:[],chips:[]},
sf_elefante:{n:"4 · Elephant Walks",svg:"sf_elefante",tip:"Piernas semi-rígidas, tronco colgando, camina con las manos por el suelo — la trompa. TRABAJA: isquiotibiales y espalda baja. Respira al colgar, no rebotes.",peso:false,rep:"2-3 cruces",alt:[],chips:[]},
sf_oso2:{n:"5 · Bear Crawl",svg:"sf_oso2",tip:"Cuatro apoyos, caderas altas, mano y pie contrario avanzan juntos. TRABAJA: hombros, muñecas e isquios. Niños: carrera de osos — quien mantenga la forma gana, no el más rápido.",peso:false,rep:"3-4 cruces",alt:[],chips:[]},
sf_bestia:{n:"6 · Beast Run",svg:"sf_bestia",tip:"El bear crawl acelerado — carrera en cuatro apoyos, rodillas flotando bajas. TRABAJA: potencia total y coordinación. ⚠️ Impacto: rodilla lista y muñecas calientes antes. Niños: la bestia persigue... suave.",peso:false,rep:"3-4 sprints cortos",alt:[],chips:[]},
sf_gatovaca:{n:"7 · Cat & Cow Rotations",svg:"sf_gatovaca",tip:"En cuatro apoyos: arquea como gato asustado, luego hunde como vaca mirando arriba — y agrega rotaciones a ambos lados. TRABAJA: movilidad de columna completa. Sincroniza con la respiración (gato exhala, vaca inhala).",peso:false,rep:"8-10 ciclos + rotaciones",alt:[],chips:[]},
sf_ganso:{n:"8 · Goose Walks",svg:"sf_ganso",tip:"Zancada profunda caminada con brazo contrario estirado al cielo — paso de ganso elegante. TRABAJA: movilidad de cadera, tobillo y hombro. ⚠️ Rodilla: zancada corta y controlada, sin dejarte caer.",peso:false,rep:"6-8 pasos por lado",alt:[],chips:[]},
sf_orangutan:{n:"9 · Orang-Utan Swings",svg:"sf_orangutan",tip:"Manos plantadas al suelo, los pies saltan en bloque hacia las manos y siguen — columpio de orangután. TRABAJA: muñeca, hombro y cadera. Aterriza suave y silencioso — el mono elegante no hace ruido.",peso:false,rep:"6-8 saltos",alt:[],chips:[]},
sf_mariposa:{n:"10 · Butterfly Pulses (cierre)",svg:"sf_mariposa",tip:"Sentado, plantas de los pies juntas, rodillas aletean suave como mariposa. TRABAJA: movilidad de cadera + bajada de revoluciones. Cierre perfecto: aleteo + 3 respiraciones lentas juntos + pregunta del motor.",peso:false,rep:"60-90\u2033",alt:[],chips:[]},
/* Juego con niños — regulación, fuerza propia y propiocepción */
jg_animal:{n:"Carrera de Animales",svg:"jg_animal",tip:"Oso (4 apoyos), cangrejo (boca arriba), rana (saltos), lagartija. Cruzar la pieza y volver, cada uno elige el animal del otro. TRABAJA: fuerza de todo el cuerpo + propiocepción (sentir dónde está cada parte). Pregunta al final: ¿qué animal costó más? ¿dónde lo sentiste?",peso:false,rep:"3-4 cruces por animal",alt:[],chips:[]},
jg_carretilla:{n:"Carretilla",svg:"jg_carretilla",tip:"Tú sostienes sus piernas (a la altura de rodillas para hacerlo más fácil, tobillos para difícil), él camina con las manos. TRABAJA: hombros, core y \u0027trabajo pesado\u0027 — el input propioceptivo profundo que más regula el sistema nervioso. Turnos cortos, celebra la distancia.",peso:false,rep:"2-3 cruces c/u",alt:[],chips:[]},
jg_empuje:{n:"Derriba la Montaña",svg:"jg_empuje",tip:"Tú eres la montaña (firme, semiflectado): él empuja con todo para moverte. Tú calibras la resistencia — que le cueste pero LO LOGRE. TRABAJA: conocer su fuerza máxima en un marco seguro. Luego invierte: empuja suave, medio, fuerte a tu orden — eso es fuerza GRADUADA, la base de la autorregulación.",peso:false,rep:"3 rondas de 20-30\u2033",alt:[],chips:[]},
jg_tira:{n:"Tira y Afloja",svg:"jg_tira",tip:"Con toalla o cuerda. Reglas: se suelta solo a la cuenta de 3, se para al decir \u0027pausa\u0027. TRABAJA: fuerza de agarre y tracción + control de impulsos (parar en plena excitación es ORO de regulación). Deja que gane la mayoría — ganar contra resistencia real construye confianza.",peso:false,rep:"4-5 rondas cortas",alt:[],chips:[]},
jg_avion:{n:"Avión",svg:"jg_avion",tip:"Tú acostado, tus pies en su cadera/abdomen, manos tomadas, él vuela con cuerpo firme como tabla. TRABAJA: core de ambos, equilibrio, confianza mutua. Dile: \u0027cuerpo de tabla, mirada al frente\u0027. Variar: soltar una mano, contar hasta 10. ⚠️ Adulto: solo sin lesiones activas.",peso:false,rep:"3-4 vuelos de 15-20\u2033",alt:[],chips:[]},
jg_semaforo:{n:"Semáforo / Estatuas",svg:"jg_semaforo",tip:"Verde = correr/saltar/bailar a full · Rojo = ESTATUA total · Amarillo = cámara lenta. Tú cantas los colores, luego él dirige. TRABAJA: inhibición y cambio de marcha — pasar de acelerado a quieto a voluntad es EL músculo de la regulación. La cámara lenta es la parte más difícil y más valiosa.",peso:false,rep:"5-6 min",alt:[],chips:[]},
jg_sandwich:{n:"Sándwich + Motor (cierre)",svg:"jg_sandwich",tip:"Sándwich de cojines: él es el relleno, presión firme y pareja con un cojín grande (presión profunda = calma el sistema). Después, acostados: 3 respiraciones lentas juntos y la pregunta del motor: \u0027¿cómo está tu motor — acelerado, justo o lento?\u0027 Aprender a LEER su propio motor es el objetivo de todo el juego.",peso:false,rep:"2-3 min + respiración",alt:[],chips:[]},
/* Liberación fascial — con rodillo y pelota */
fr_glut:{n:"Glúteo / Piramidal (rodillo)",svg:"fr_glut",tip:"Sentado sobre el rodillo o pelota, tobillo cruzado sobre rodilla, busca el punto sensible y respira ahí. Presión firme pero respirable — si contienes la respiración, es demasiado.",peso:false,rep:"60\u2033 por lado",alt:[],chips:[]},
fr_isq:{n:"Isquiotibiales (rodillo)",svg:"fr_isq",tip:"Rodillo bajo el muslo posterior, rueda lento del glúteo a la rodilla. Detente 20\u2033 en los puntos que hablan. Tus isquios de nieve lo agradecen.",peso:false,rep:"60\u2033 por lado",alt:[],chips:[]},
fr_cuad:{n:"Cuádriceps / Banda IT (rodillo)",svg:"fr_cuad",tip:"Boca abajo, rodillo bajo el muslo frontal, luego gira levemente al lateral (IT). Lento, sin rebotar. La IT duele — presión moderada ahí.",peso:false,rep:"60\u2033 por lado",alt:[],chips:[]},
fr_gem:{n:"Gemelo / Sóleo (rodillo)",svg:"fr_gem",tip:"Rodillo bajo la pantorrilla, rueda del tobillo a la rodilla. Cruza la otra pierna encima para más presión. Rota el pie para cubrir todo.",peso:false,rep:"45\u2033 por lado",alt:[],chips:[]},
fr_psoas:{n:"Psoas (pelota)",svg:"fr_psoas",tip:"Boca abajo, pelota entre ombligo y cadera (lateral). Peso gradual, respira LENTO ahí 60\u2033. El psoas guarda estrés — suéltalo con paciencia, nunca con dolor agudo.",peso:false,rep:"60\u2033 por lado",alt:[],chips:[]},
fr_dorsal:{n:"Dorsal (rodillo bajo axila)",svg:"fr_dorsal",tip:"De lado, rodillo bajo la axila sobre el dorsal, brazo extendido. Rueda corto. Clave para hombro de remada suelto.",peso:false,rep:"45\u2033 por lado",alt:[],chips:["surf"]},
fr_lumbar:{n:"Descompresión lumbar",svg:"st_rodpecho",tip:"Rodillas al pecho balanceando suave 60\u2033 + giros espinales a cada lado. Cierra la secuencia descomprimiendo la espalda baja.",peso:false,rep:"2\u2032 total",alt:[],chips:[]},
sentadilla:{n:"Sentadilla",svg:"sentadilla",tip:"Baja como sentándote, rodillas siguen la punta del pie, espalda neutra. Con alta médica: rango completo, sube profundidad y carga progresivo.",peso:true,par:"B",alt:["hip_thrust","zancada"],chips:["carga"]},
zancada:{n:"Zancada",svg:"zancada",tip:"Paso largo, rodilla trasera cerca del suelo, tronco erguido. Alterna piernas. Mancuernas a los costados para cargar. Muy funcional para snowboard.",peso:true,par:"A",alt:["stepup","hip_thrust"],chips:["carga"]},
stepup:{n:"Step-up al Cajón",svg:"stepup",tip:"Sube a un cajón/banco firme empujando con el talón, controla la bajada. Unilateral — equilibrio y fuerza para tabla.",peso:true,par:"A",alt:["zancada"],chips:["carga"]},
boxjump:{n:"Salto al Cajón",svg:"boxjump",tip:"Salto explosivo, aterriza suave y absorbido. Empieza cajón bajo y sube progresivo. Reintroducción de impacto — potencia surf/snowboard.",peso:false,rep:"5–6 saltos",alt:["sentadilla"],chips:[]},
elev_lat:{n:"Elevaciones Laterales",svg:"elev_lat",tip:"EL constructor de ancho de hombro. Sube a la altura del hombro, codo levemente flexionado, sin impulso. Liviano y estricto gana. Casa: Par A o naranja.",peso:true,par:"A",alt:["arnold"],chips:["carga"]},
arnold:{n:"Press Arnold",svg:"arnold",tip:"Press que rota de palmas-adentro a palmas-afuera. Trabaja deltoides frontal y lateral juntos. Casa: Par A/B.",peso:true,par:"B",alt:["press_militar","press_manc"],chips:["carga"]},
face_pull:{n:"Face Pull",svg:"face_pull",tip:"Banda o polea a la altura de la cara. Tira hacia la frente separando las manos. Deltoides posterior + postura — clave para remada y hombro sano.",peso:false,rep:"15 reps",alt:["remo_banda"],chips:["surf"]},
pullover:{n:"Pull-over",svg:"pullover",tip:"Acostado, mancuerna sobre el pecho, baja atrás de la cabeza y vuelve. Dorsal + serrato — el músculo de la remada de surf. Casa: Par A/B.",peso:true,par:"A",alt:["remo_banda"],chips:["surf","carga"]},
pushup_exp:{n:"Push-up Explosivo (duck dive)",svg:"pushup_exp",tip:"Flexión bajando controlado y empujando FUERTE (manos despegan si puedes). Es el patrón exacto del pato bajo el agua. Sin salto de pies — rodilla protegida.",peso:false,rep:"6–8 explosivas",alt:["flexiones"],chips:["surf","rodilla"]},
rot_ext:{n:"Rotación Externa (manguito)",svg:"rot_ext",tip:"Codo pegado al costado 90°, banda al frente, gira el antebrazo hacia afuera. Fortalece el manguito rotador — la pieza que mantiene el hombro sano y sin lesiones. Liviano y estricto.",peso:false,rep:"15 por lado",alt:["face_pull"],chips:["surf"]},
reverse_fly:{n:"Pájaro (deltoides posterior)",svg:"reverse_fly",tip:"Inclinado hacia adelante, abre los brazos como alas apretando la espalda alta. Aísla deltoides posterior — equilibra el empuje y mejora postura y remada. Casa: Par A o liviano.",peso:true,par:"A",alt:["face_pull"],chips:["surf","carga"]},
/* Bloques piscina — descansos incluidos en cada bloque */
sw_cal:{mt:400,n:"Calentamiento",svg:"nado",tip:"Suave, suelta el cuerpo. Respiración bilateral c/3 desde el primer largo.",peso:false,rep:"200 libre + 4×50 técnica /15\u2033",alt:[],chips:[]},
sw_50f:{mt:400,n:"Serie Fuerte 50s",svg:"nado",tip:"Ritmo fuerte sostenido, RPE 7–8. Respiración c/3.",peso:false,rep:"10×50 fuerte /20\u2033",alt:["sw_pullpal"],chips:[]},
sw_25s:{mt:200,n:"Sprints 25s",svg:"nado",tip:"Máxima velocidad con técnica. Si cae la velocidad, corta.",peso:false,rep:"8×25 sprint /30\u2033",alt:[],chips:[]},
sw_100:{mt:400,n:"Ritmo 100s",svg:"nado",tip:"Sostenido, controla la respiración c/3.",peso:false,rep:"4×100 sostenido /20\u2033",alt:["sw_pullpal"],chips:[]},
sw_400:{mt:1200,n:"Fondo Aeróbico",svg:"nado",tip:"Ritmo conversacional, RPE 5–6. Aquí descargas las piernas del gym.",peso:false,rep:"3×400 (o 2×600) /30\u2033",alt:["sw_pullpal"],chips:[]},
sw_pir:{mt:1200,n:"Pirámide de esfuerzo 3×400",svg:"nado",tip:"1º suave (RPE 5) → 2º medio (RPE 6) → 3º suave. Respiración c/3. Reactiva sin machacar — ideal tras días sin entrenar.",peso:false,rep:"3×400 pirámide /30\u2033",alt:["sw_400"],chips:[]},

const store={
 async get(){
  try{if(window.storage){const r=await window.storage.get(KEY);if(r&&r.value)return JSON.parse(r.value)}}catch(e){}
  try{const v=localStorage.getItem(KEY);if(v)return JSON.parse(v)}catch(e){}
  return null;
 },
 async set(d){
  const v=JSON.stringify(d);
  try{if(window.storage)await window.storage.set(KEY,v)}catch(e){}

 }
};
async function loadLogs(){
 const d=(await store.get())||{};
 S.logs=d.logs||{};S.cfg=d.cfg||INIT_BAKED.cfg;if(!S.cfg.kcal)S.cfg.kcal=CONFIG.kcalDefault;
 // Fusión horneado+vivo: lo horneado por Claude entra si no existe ya (clave fecha+fase / fecha)

 S.pop=(d.pop&&d.pop.day!=null)?d.pop:(INIT_BAKED.pop||{day:null,set:null});
 S.hist=hv.concat(INIT_BAKED.hist.filter(b=>!hv.some(s=>key(s)===key(b)))).sort((a,b2)=>a.d<b2.d?-1:1);

 S.mood=mv.concat((INIT_BAKED.mood||[]).filter(b=>!mv.some(x=>x.d===b.d)));

   <b style="color:var(--ink)">Mes:</b> ${mof.length} sesiones · ${(sm(mof)/60).toFixed(1)} h${dm(mof)?` · ${(dm(mof)/1000).toFixed(1)} km`:""}</p>
   <button class="btn ghost" style="margin-top:8px" onclick="go('stats')">Ver estadísticas completas →</button></div>
  <button class="btn" onclick="startElong('${stretchZone()}')">🤸 Elongar ahora (guiada)</button>
  <div class="excard" style="margin-top:14px">
   <div class="lbl" style="color:var(--carga)">🍽️ Ventana post-entreno (30–60 min)</div>
   <p style="font-size:13px;color:var(--ink-2);margin-top:6px">1 scoop de proteína (~25–30 g) + carbohidrato: fruta, avena o arroz (~0.5–1 g/kg si fue sesión fuerte). Completa tu gap del día hacia 180–200 g de proteína.</p>
   <div class="lbl" style="color:var(--agua);margin-top:12px">🌙 Recuperación nocturna</div>
   <p style="font-size:13px;color:var(--ink-2);margin-top:6px">${legDay?"Piernas pesadas → EMS drenaje (modo 2/10) o liberación fascial.<br>":""}Magnesio 200–400 mg (glicinato o citrato se toleran mejor) ~1 h antes de dormir puede ayudar al sueño y recuperación muscular.<br>Ventana de sueño 22:30–23:00 → 06:00,</p>
   <div class="lbl" style="color:var(--ok);margin-top:12px">🧖 Recuperación extra (si tienes acceso)</div>
   <p style="font-size:13px;color:var(--ink-2);margin-top:6px">Sauna: 10–15 min post-entreno o en día de descanso — relaja, mejora circulación, ayuda al sueño si es 1–2 h antes de dormir. Hidrátate bien. Jacuzzi con chorros: apunta los jets a piernas/espalda tras piernas pesadas o snowboard (masaje + drenaje). No sauna caliente largo el mismo día de sesión muy intensa deshidratado.</p>
   <p style="font-size:11px;color:var(--ink-3);margin-top:10px">Dosis general, no médica. Verifica suplementos con tu médico, especialmente si tomas medicamentos.</p>
  </div>
  <button class="btn ghost" onclick="exportProg()">📤 Exportar progreso</button>
  <button class="btn ghost" onclick="resetAll()">Nueva sesión</button>
  <p class="footer-note">Registra tu log del día: ánimo · energía · sueño · entrenó ✓.</p>`;
 }
 window.scrollTo(0,0);
}

/* ============ FLUJO ============ */
window.pick=(k,v)=>{S[k]=v;
 if(k==="lugar"){S.fase=null;S.screen="fase"}
 else if(k==="fase"){S.screen="tiempo"}
 else if(k==="tiempo"){const p=PLANES[S.lugar][S.fase];S.plan=p.lista.slice(0,p.corte[v]);S.screen="resumen"}
 render()};
window.go=s=>{S.screen=s;render()};
window.startSession=()=>{S.idx=0;S.serieDone={};S.screen="sesion";render()};
window.swapAlt=()=>{const id=S.plan[S.idx];const alts=EX[id].alt.filter(a=>!S.plan.includes(a)||a===id);const next=(EX[id].alt.find(a=>!S.plan.slice(0,S.idx).includes(a)))||EX[id].alt[0];S.plan[S.idx]=next;S.serieDone[S.idx]=0;render()};
window.skipEx=()=>{nextEx()};
window.prevEx=()=>{if(S.idx>0){S.idx--;S.screen="sesion";render()}};
window.setWk=(k,v)=>{if(k==='sport')S.wkSport=v;else S.wkPar=v;render()};
window.quitSession=()=>{
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="sheet"><h2>¿Salir de la sesión?</h2>
  <p style="font-size:13px;color:var(--ink-2);margin:8px 0 16px">Tus pesos registrados hasta ahora quedan guardados. Puedes terminar aquí o volver.</p>
  <button class="btn" id="qcierre">Terminar y ver cierre</button>
  <button class="btn ghost" id="qsalir">Salir al inicio</button>
  <button class="btn ghost" id="qvolver">Seguir entrenando</button></div>`;
 document.body.appendChild(m);
 m.querySelector("#qcierre").onclick=()=>{m.remove();S.screen="fin";render()};
 m.querySelector("#qsalir").onclick=()=>{m.remove();resetAll()};
 m.querySelector("#qvolver").onclick=()=>m.remove();
};
window.doSerie=(i)=>{
 const done=S.serieDone[S.idx]||0;
 if(i!==done) return;
 S.serieDone[S.idx]=done+1;
 const p=PLANES[S.lugar][S.fase], ns=p.series[S.tiempo];
 if(S.serieDone[S.idx]>=ns){ askLog(); }
 else { restTimer(p.rest); }
 render();
};
function nextEx(){
 if(S.idx+1>=S.plan.length){S.screen="fin";render()}
 else {S.idx++;S.screen="sesion";render();
  // Timer de transición entre ejercicios (más corto que descanso entre series)
  const p=PLANES[S.lugar][S.fase];
  if(p.rest>0){transTimer(Math.max(30,p.rest))}
 }
}
function transTimer(sec){
 const w=document.createElement("div");w.className="timerwrap";
 w.innerHTML=`<div class="timerlbl">Cambio de ejercicio · prepárate</div><div class="timer" id="tval" style="color:var(--ok)">${sec}</div><button class="timerskip" onclick="endTimer()">Empezar ya</button>`;
 document.body.appendChild(w);
 clearInterval(tInt);let t=sec;
 tInt=setInterval(()=>{t--;const el=document.getElementById("tval");if(el)el.textContent=t;if(t<=0){endTimer()}},1000);
 window.endTimer=()=>{clearInterval(tInt);tInt=null;document.querySelector(".timerwrap")?.remove()};
}

/* ============ TIMER ============ */
let tInt=null;
function restTimer(sec){
 const w=document.createElement("div");w.className="timerwrap";
 w.innerHTML=`<div class="timerlbl">Descanso</div><div class="timer" id="tval">${sec}</div><button class="timerskip" onclick="endTimer()">Saltar descanso</button>`;
 document.body.appendChild(w);
 let t=sec;
 tInt=setInterval(()=>{t--;const el=document.getElementById("tval");if(el)el.textContent=t;
  if(t<=0){endTimer()}},1000);
 window.endTimer=()=>{clearInterval(tInt);tInt=null;const el=document.querySelector(".timerwrap");if(el)el.remove()};
}

/* ============ LOG PESO/SENSACIÓN ============ */
function askLog(){
 const id=S.plan[S.idx], ex=EX[id];
 if(!ex.peso){nextEx();return}
 // Peso sugerido: último registrado, o el par de settings
 let pre="";
 const h=S.logs[id];
 if(h&&h.length) pre=h[h.length-1].p;
 else if(S.lugar==="casa"&&ex.par&&S.cfg.mA!=null) pre = ex.par==="B" ? (S.cfg.mB??"") : (S.cfg.mA??"");
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="sheet">
  <h2>${ex.n} — registro</h2>
  <div class="lbl">Peso usado (kg)</div>
  <input id="pval" type="number" inputmode="decimal" value="${pre}" placeholder="0">
  <div class="lbl">¿Cómo se sintió?</div>
  <div class="feel" id="feels">${["😵","😣","😐","🙂","💪"].map((e,i)=>`<button data-f="${i+1}">${e}</button>`).join("")}</div>
  <button class="btn" id="saveLog">Guardar y seguir</button>
  <button class="btn ghost" id="skipLog">Seguir sin registrar</button>
 </div>`;
 document.body.appendChild(m);
 let f=3;
 m.querySelectorAll("#feels button").forEach(b=>b.onclick=()=>{f=+b.dataset.f;m.querySelectorAll("#feels button").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")});
 m.querySelector("#saveLog").onclick=async()=>{
  const p=parseFloat(m.querySelector("#pval").value);
  if(!isNaN(p)&&p>0){ if(!S.logs[id])S.logs[id]=[]; S.logs[id].push({p,f,d:new Date().toISOString().slice(0,10)}); if(S.logs[id].length>20)S.logs[id]=S.logs[id].slice(-20); await saveLogs(); }
  m.remove(); nextEx();
 };
 m.querySelector("#skipLog").onclick=()=>{m.remove();nextEx()};
}
window.popDay=()=>{if(S.pop==null||S.pop.day==null||!S.pop.set)return null;const el=Math.floor((new Date(new Date().toISOString().slice(0,10))-new Date(S.pop.set))/864e5);return S.pop.day+el};
window.setPop=async(n)=>{S.pop={day:n,set:new Date().toISOString().slice(0,10)};await saveLogs();render()};
function guiaPop(d){return {t:"",s:[]}}
window.resetAll=()=>{S={...S,screen:"lugar",lugar:null,fase:null,tiempo:null,plan:[],idx:0,serieDone:{},sesSaved:false};render()};
window.saveMts=async()=>{const v=parseFloat(document.getElementById("mts").value);if(!isNaN(v)&&v>0&&S.hist.length){S.hist[S.hist.length-1].m=S.lugar==="ruta"?v*1000:v;await saveLogs();document.getElementById("mts").value="";document.getElementById("mts").placeholder="✓ guardado"}};
window.saveBody=async()=>{const kg=parseFloat(document.getElementById("bkg").value),fat=parseFloat(document.getElementById("bfat").value),mme=parseFloat(document.getElementById("bmme").value);
 if(!isNaN(kg)){S.body.push({d:new Date().toISOString().slice(0,10),kg,fat:isNaN(fat)?null:fat,mme:isNaN(mme)?null:mme});await saveLogs();render()}};
window.saveMood=async(v)=>{const d=new Date().toISOString().slice(0,10);S.mood=(S.mood||[]).filter(m=>m.d!==d);S.mood.push({d,v});await saveLogs();render()};
window.exportProg=()=>{
 let txt="PROGRESO — Coach Dani\n"+new Date().toLocaleDateString()+"\n\n";
 const ids=Object.keys(S.logs);
 if(!ids.length){txt+="(Aún sin registros de peso)"}
 else ids.forEach(id=>{
  const ex=EX[id]?EX[id].n:id, h=S.logs[id];
  txt+=`${ex}:\n`;
  h.forEach(u=>{txt+=`  ${u.d} · ${u.p} kg · sensación ${u.f}/5\n`});
  txt+="\n";
 });
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="sheet"><h2>Exportar progreso</h2>
  <textarea readonly style="width:100%;height:160px;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;color:var(--ink);font-size:12px;padding:10px;font-family:monospace">${txt}</textarea>
  <button class="btn" id="cp">Copiar al portapapeles</button>
  <button class="btn ghost" id="cpj">Copiar respaldo JSON</button>
  <div class="lbl" style="margin-top:12px;color:var(--agua)">Restaurar desde respaldo</div>
  <textarea id="impj" placeholder="Pega aquí un respaldo JSON…" style="width:100%;height:60px;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;color:var(--ink);font-size:11px;padding:8px;font-family:monospace;margin-top:6px"></textarea>
  <button class="btn ghost" id="imp">Cargar respaldo</button>
  <button class="btn ghost" id="cl">Cerrar</button></div>`;
 document.body.appendChild(m);
 m.querySelector("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(txt);m.querySelector("#cp").textContent="✓ Copiado"}catch(e){m.querySelector("textarea").select()}};
 m.querySelector("#cpj").onclick=async()=>{const j=JSON.stringify({logs:S.logs,cfg:S.cfg});try{await navigator.clipboard.writeText(j);m.querySelector("#cpj").textContent="✓ JSON copiado"}catch(e){}};
 m.querySelector("#imp").onclick=async()=>{try{const d=JSON.parse(m.querySelector("#impj").value);if(d.logs){S.logs=d.logs;S.cfg=d.cfg||S.cfg;await saveLogs();m.querySelector("#imp").textContent="✓ Restaurado"}}catch(e){m.querySelector("#imp").textContent="JSON inválido"}};
 m.querySelector("#cl").onclick=()=>m.remove();
};
window.saveCfg=async()=>{const a=parseFloat(document.getElementById("mA").value),b=parseFloat(document.getElementById("mB").value);S.cfg.mA=isNaN(a)?null:a;S.cfg.mB=isNaN(b)?null:b;await saveLogs();go("lugar")};

/* ====== RECUPERACIÓN: SUEÑO ====== */
window.sleepRec=(caso)=>{
 const out=document.getElementById("sleepOut");
 const M={
  mal:{h:"Prioriza 7.5–8 h esta noche + power nap de 20\u2032 hoy (13–15h, no más tarde ni más largo o te cuesta dormir).",n:"El agente baja la intensidad de tu semana hoy: solo Z2 suave o recuperación."},
  fiesta:{h:"Recupera con 8 h la próxima noche, no intentes 'compensar' hoy con una siesta larga. Power nap 20\u2032 si vas muy justo.",n:"Hidrátate extra. Nada de fuerza intensa hoy."},
  intenso:{h:"Apunta a 8 h — el músculo se construye durmiendo, no entrenando. Ventana firme 22:30.",n:"Sesión intensa + buen sueño = recomposición. Sesión intensa + mal sueño = catabolismo."},
  bien:{h:"Mantén tu ventana 22:30–23:00 → 06:00. No hace falta siesta si dormiste 7h+.",n:"Vas bien. La consistencia del horario es lo que sostiene tu energía y recuperación."}
 };
 const d=M[caso];
 out.innerHTML=`<div class="excard" style="margin-top:16px"><div class="reco" style="color:var(--agua);font-size:14px">${d.h}</div><p style="font-size:12.5px;color:var(--ink-2);margin-top:8px">${d.n}</p>
 <p style="font-size:11.5px;color:var(--ink-3);margin-top:10px">⚠️ Power nap = 20\u2032 máximo, antes de las 15h. Más largo entra en sueño profundo y despiertas peor y te descuadra la noche.</p></div>`;
};

/* ====== RECUPERACIÓN: ELONGACIÓN GUIADA ====== */
let elState=null;
window.startElong=(k)=>{elState={zone:k,i:0};runElong()};
function runElong(){
 const z=ELONG[elState.zone], it=z.items[elState.i];
 if(!it){document.querySelector(".timerwrap")?.remove();go('elong');return}
 let w=document.querySelector(".timerwrap");
 if(!w){w=document.createElement("div");w.className="timerwrap";document.body.appendChild(w)}
 w.innerHTML=`<div class="timerlbl">${elState.i+1} de ${z.items.length}</div>
  <div style="width:200px;background:var(--panel-2);border-radius:12px;padding:8px;margin-bottom:10px">${SVGS[it[2]]||""}</div>
  <div style="font-size:20px;font-weight:800;color:var(--ink);text-align:center;padding:0 24px;margin-bottom:10px">${it[0]}</div>
  <div class="timer" id="tval">${it[1]}</div>
  <button class="timerskip" onclick="nextElong()">Siguiente →</button>
  <button class="timerskip" style="margin-top:10px;background:transparent;border-color:var(--ink-3);color:var(--ink-3)" onclick="exitElong()">✕ Salir</button>`;
 clearInterval(tInt);let t=it[1];
 tInt=setInterval(()=>{t--;const el=document.getElementById("tval");if(el)el.textContent=t;if(t<=0){nextElong()}},1000);
}
window.nextElong=()=>{clearInterval(tInt);elState.i++;runElong()};
window.exitElong=()=>{clearInterval(tInt);document.querySelector(".timerwrap")?.remove();go('elong')};

/* ====== RECUPERACIÓN: MEDITACIÓN ====== */
window.pickMedit=(k)=>{
 const v=MEDIT[k];
 app.innerHTML=`<button class="back" onclick="go('medit')">← Meditación</button><h1>${v.n}</h1><p class="sub">${v.guide}</p>
 <div class="row">${v.min.map(mn=>`<div class="opt" onclick="startMedit(${mn})"><div class="t">${mn}\u2032</div></div>`).join("")}</div>
 <p class="footer-note">Mínimo viable: 3\u2032. Consistencia &gt; duración.</p>`;
};
window.startMedit=(mn)=>{
 let secs=mn*60;
 const w=document.createElement("div");w.className="timerwrap";document.body.appendChild(w);
 const upd=()=>{const m=Math.floor(secs/60),s=secs%60;const el=document.getElementById("tval");if(el)el.textContent=`${m}:${String(s).padStart(2,"0")}`};
 w.innerHTML=`<div class="timerlbl">Meditación</div><div class="timer" id="tval">${mn}:00</div><button class="timerskip" onclick="endMedit()">Terminar</button>`;
 clearInterval(tInt);
 tInt=setInterval(()=>{secs--;upd();if(secs<=0){endMedit()}},1000);
 window.endMedit=()=>{clearInterval(tInt);document.querySelector(".timerwrap")?.remove();go('medit')};
};

/* ====== RECUPERACIÓN: RESPIRACIÓN GUIADA ====== */
window.startResp=(k)=>{
 const v=RESP[k];let ciclo=0,fase=0;
 const w=document.createElement("div");w.className="timerwrap";document.body.appendChild(w);
 function paso(){
  if(ciclo>=v.ciclos){clearInterval(tInt);w.remove();go('resp');return}
  const [txt,dur]=v.fases[fase];
  const grow=/nhala/.test(txt);const shrink=/xhala/.test(txt);
  const scale=grow?1.5:shrink?0.7:1;
  w.innerHTML=`<div class="timerlbl">Ciclo ${ciclo+1} de ${v.ciclos}</div>
   <div style="width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--agua-dk),transparent);border:3px solid var(--agua);margin:20px 0;transition:transform ${dur}s ease-in-out;transform:scale(${scale})"></div>
   <div style="font-size:24px;font-weight:800;color:var(--ink)">${txt}</div>
   <div class="timer" id="tval" style="font-size:56px">${dur}</div>
   <button class="timerskip" onclick="endResp()">Terminar</button>`;
  clearInterval(tInt);let t=dur;
  tInt=setInterval(()=>{t--;const el=document.getElementById("tval");if(el)el.textContent=t;
   if(t<=0){fase++;if(fase>=v.fases.length){fase=0;ciclo++}paso()}},1000);
 }
 window.endResp=()=>{clearInterval(tInt);document.querySelector(".timerwrap")?.remove();go('resp')};
 paso();
};

/* ====== RECUPERACIÓN: SUELO PÉLVICO ====== */
let kgState=null;
window.startKegel=(k)=>{kgState={mode:k,i:0};runKegel()};
function runKegel(){
 const z=KEGEL[kgState.mode], it=z.items[kgState.i];
 if(!it){document.querySelector(".timerwrap")?.remove();go('kegel');return}
 const on=/ontrae|prieta/.test(it[0]);
 let w=document.querySelector(".timerwrap");
 if(!w){w=document.createElement("div");w.className="timerwrap";document.body.appendChild(w)}
 const col=on?"var(--carga)":"var(--agua)";
 w.innerHTML=`<div class="timerlbl">${kgState.i+1} de ${z.items.length}</div>
  <div style="width:130px;height:130px;border-radius:50%;border:4px solid ${col};display:flex;align-items:center;justify-content:center;margin:16px 0;transition:transform .4s;transform:scale(${on?1.2:0.85})">
   <span style="font-size:22px;font-weight:800;color:${col}">${on?"▲":"▽"}</span></div>
  <div style="font-size:26px;font-weight:800;color:${col}">${it[0]}</div>
  <div class="timer" id="tval" style="font-size:56px">${it[1]}</div>
  <button class="timerskip" onclick="endKegel()">Terminar</button>
  <button class="timerskip" style="margin-top:10px;background:transparent;border-color:var(--ink-3);color:var(--ink-3)" onclick="endKegel()">✕ Salir</button>`;
 clearInterval(tInt);let t=it[1];
 tInt=setInterval(()=>{t--;const el=document.getElementById("tval");if(el)el.textContent=t;if(t<=0){kgState.i++;runKegel()}},1000);
}
window.endKegel=()=>{clearInterval(tInt);document.querySelector(".timerwrap")?.remove();go('kegel')};

loadLogs().then(render);
</script>
</body>
</html>
