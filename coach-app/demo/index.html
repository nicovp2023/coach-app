<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Coach · Entrenamiento</title>
<style>
:root{
  --bg:#0F1B21; --panel:#16262E; --panel-2:#1C303A; --line:#2A424E;
  --ink:#E9F0F2; --ink-2:#8FA6AE; --ink-3:#5C737C;
  --agua:#3EC9D9; --agua-dk:#0E7B88; --carga:#F2A93B; --ok:#5BC978; --alerta:#E86A5C;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);max-width:520px;margin:0 auto;min-height:100vh;padding:18px 16px 40px;line-height:1.45}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--agua)}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:2px 0 4px}
h2{font-size:18px;font-weight:800;margin:0 0 10px}
.sub{font-size:13px;color:var(--ink-2);margin-bottom:18px}
.grid{display:grid;gap:10px}
.opt{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .15s}
.opt:active{border-color:var(--agua)}
.opt .t{font-size:16px;font-weight:800}
.opt .d{font-size:12px;color:var(--ink-2);margin-top:3px}
.opt.sel{border-color:var(--agua);background:var(--panel-2)}
.row{display:flex;gap:10px}
.row .opt{flex:1;text-align:center}
.btn{display:block;width:100%;background:var(--agua);color:#06272C;border:none;border-radius:var(--r);padding:15px;font-size:15px;font-weight:800;cursor:pointer;margin-top:16px}
.btn.ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line);font-weight:600}
.btn:disabled{opacity:.35}
.back{background:none;border:none;color:var(--ink-3);font-size:13px;font-weight:700;cursor:pointer;padding:0;margin-bottom:14px}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:6px;background:var(--panel-2);color:var(--agua);border:1px solid var(--line);margin-right:6px}
.chip.carga{color:var(--carga)}
.chip.rodilla{color:var(--alerta)}
/* Tarjeta ejercicio */
.excard{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exname{font-size:17px;font-weight:800}
.exmeta{font-size:12px;color:var(--ink-2);margin-top:2px}
.fig{background:var(--panel-2);border-radius:10px;margin:12px 0;padding:6px;display:flex;justify-content:center}
.fig svg{width:100%;max-width:280px;height:auto}
.fig .fA,.fig .fB{stroke:var(--ink);stroke-width:4;stroke-linecap:round;fill:none}
.fig circle.h{fill:var(--ink);stroke:none}
.fig .lb{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;fill:none}
.fig .jt{fill:var(--agua);stroke:#0E7B88;stroke-width:.5;r:2.8}
.fig .wt{fill:var(--carga)}
.fig .acc{stroke:var(--carga)}
.fig .fA{animation:swapA 2s infinite}
.fig .fB{animation:swapB 2s infinite;opacity:0}
@keyframes swapA{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
@keyframes swapB{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.fig .fA{animation:none}.fig .fB{animation:none;opacity:0}}
.series{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.serie{flex:1;min-width:60px;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:12px 0;text-align:center;font-weight:800;font-size:14px;color:var(--ink-2);cursor:pointer}
.serie.done{background:var(--agua-dk);border-color:var(--agua);color:#fff}
.reco{font-size:12.5px;color:var(--carga);margin-top:8px;font-weight:600}
.reco.none{color:var(--ink-3);font-weight:400}
.linkalt{background:none;border:none;color:var(--agua);font-size:12.5px;font-weight:700;cursor:pointer;padding:0;margin-top:10px}
/* Timer descanso */
.timerwrap{position:fixed;inset:0;background:rgba(6,17,21,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50}
.timer{font-size:88px;font-weight:800;letter-spacing:-2px;color:var(--agua);font-variant-numeric:tabular-nums}
.timerlbl{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.timerskip{margin-top:26px;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 28px;font-weight:700;cursor:pointer}
/* Modal log */
.modal{position:fixed;inset:0;background:rgba(6,17,21,.9);display:flex;align-items:flex-end;z-index:60}
.sheet{background:var(--panel);border-radius:20px 20px 0 0;padding:22px 18px 30px;width:100%;max-width:520px;margin:0 auto}
.sheet input{width:100%;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;color:var(--ink);font-size:20px;font-weight:800;padding:12px;text-align:center;margin:8px 0 14px}
.feel{display:flex;gap:8px}
.feel button{flex:1;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:12px 0;font-size:20px;cursor:pointer}
.feel button.sel{border-color:var(--carga);background:#3a2d14}
.lbl{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3)}
.progress{height:5px;background:var(--panel-2);border-radius:3px;margin:14px 0 18px;overflow:hidden}
.progress div{height:100%;background:var(--agua);border-radius:3px;transition:width .3s}
.dots{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 10px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:all .2s}
.dot.done{background:var(--agua);border-color:var(--agua)}
.dot.now{border-color:var(--carga);background:var(--carga);box-shadow:0 0 0 4px rgba(242,169,59,.2)}
.done-card{text-align:center;padding:40px 10px}
.done-card .big{font-size:52px}
.hist{font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
.footer-note{font-size:11.5px;color:var(--ink-3);margin-top:20px;text-align:center}
.demobar{background:var(--panel-2);border:1px solid var(--carga);border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--ink-2);margin-bottom:16px;cursor:pointer;line-height:1.5}
</style>
</head>

 }

}

/* ============ FLUJO ============ */
window.pick=(k,v)=>{S[k]=v;
 if(k==="lugar"){S.fase=null;S.screen="fase"}
 else if(k==="fase"){S.screen="tiempo"}
 else if(k==="tiempo"){const p=PLANES[S.lugar][S.fase];S.plan=p.lista.slice(0,p.corte[v]);S.screen="resumen"}
 render()};
window.go=s=>{S.screen=s;render()};
window.startSession=()=>{S.idx=0;S.serieDone={};S.screen="sesion";render()};
window.swapAlt=()=>{const id=S.plan[S.idx];const alts=EX[id].alt.filter(a=>!S.plan.includes(a)||a===id);const next=(EX[id].alt.find(a=>!S.plan.slice(0,S.idx).includes(a)))||EX[id].alt[0];S.plan[S.idx]=next;S.serieDone[S.idx]=0;render()};
window.skipEx=()=>{nextEx()};
window.prevEx=()=>{if(S.idx>0){S.idx--;S.screen="sesion";render()}};
window.setWk=(k,v)=>{if(k==='sport')S.wkSport=v;else S.wkPar=v;render()};
window.quitSession=()=>{
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="sheet"><h2>¿Salir de la sesión?</h2>
  <p style="font-size:13px;color:var(--ink-2);margin:8px 0 16px">Tus pesos registrados hasta ahora quedan guardados. Puedes terminar aquí o volver.</p>
  <button class="btn" id="qcierre">Terminar y ver cierre</button>
  <button class="btn ghost" id="qsalir">Salir al inicio</button>
  <button class="btn ghost" id="qvolver">Seguir entrenando</button></div>`;
 document.body.appendChild(m);
 m.querySelector("#qcierre").onclick=()=>{m.remove();S.screen="fin";render()};
 m.querySelector("#qsalir").onclick=()=>{m.remove();resetAll()};
 m.querySelector("#qvolver").onclick=()=>m.remove();
};
window.doSerie=(i)=>{
 const done=S.serieDone[S.idx]||0;
 if(i!==done) return;
 S.serieDone[S.idx]=done+1;
 const p=PLANES[S.lugar][S.fase], ns=p.series[S.tiempo];
 if(S.serieDone[S.idx]>=ns){ askLog(); }
 else { restTimer(p.rest); }
 render();
};
function nextEx(){
 if(S.idx+1>=S.plan.length){S.screen="fin";render()}
 else {S.idx++;S.screen="sesion";render();
  // Timer de transición entre ejercicios (más corto que descanso entre series)
  const p=PLANES[S.lugar][S.fase];
  if(p.rest>0){transTimer(45)}
 }
}
function transTimer(sec){
 const w=document.createElement("div");w.className="timerwrap";
 w.innerHTML=`<div class="timerlbl">Cambio de ejercicio · prepárate</div><div class="timer" id="tval" style="color:var(--ok)">${sec}</div><button class="timerskip" onclick="endTimer()">Empezar ya</button>`;
 document.body.appendChild(w);
 clearInterval(tInt);let t=sec;
 tInt=setInterval(()=>{t--;const el=document.getElementById("tval");if(el)el.textContent=t;if(t<=0){endTimer()}},1000);
 window.endTimer=()=>{clearInterval(tInt);tInt=null;document.querySelector(".timerwrap")?.remove()};
}

/* ============ TIMER ============ */
let tInt=null;
function restTimer(sec){
 const w=document.createElement("div");w.className="timerwrap";
 w.innerHTML=`<div class="timerlbl">Descanso</div><div class="timer" id="tval">${sec}</div><button class="timerskip" onclick="endTimer()">Saltar descanso</button>`;
 document.body.appendChild(w);
 let t=sec;
 tInt=setInterval(()=>{t--;const el=document.getElementById("tval");if(el)el.textContent=t;
  if(t<=0){endTimer()}},1000);
 window.endTimer=()=>{clearInterval(tInt);tInt=null;const el=document.querySelector(".timerwrap");if(el)el.remove()};
}

/* ============ LOG PESO/SENSACIÓN ============ */
function askLog(){
 const id=S.plan[S.idx], ex=EX[id];
 if(!ex.peso){nextEx();return}
 // Peso sugerido: último registrado, o el par de settings
 let pre="";
 const h=S.logs[id];
 if(h&&h.length) pre=h[h.length-1].p;
 else if(S.lugar==="casa"&&ex.par&&S.cfg.mA!=null) pre = ex.par==="B" ? (S.cfg.mB??"") : (S.cfg.mA??"");
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="sheet">
  <h2>${ex.n} — registro</h2>
  <div class="lbl">Peso usado (kg)</div>
  <input id="pval" type="number" inputmode="decimal" value="${pre}" placeholder="0">
  <div class="lbl">¿Cómo se sintió?</div>
  <div class="feel" id="feels">${["😵","😣","😐","🙂","💪"].map((e,i)=>`<button data-f="${i+1}">${e}</button>`).join("")}</div>
  <button class="btn" id="saveLog">Guardar y seguir</button>
  <button class="btn ghost" id="skipLog">Seguir sin registrar</button>
 </div>`;
 document.body.appendChild(m);
 let f=3;
 m.querySelectorAll("#feels button").forEach(b=>b.onclick=()=>{f=+b.dataset.f;m.querySelectorAll("#feels button").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")});
 m.querySelector("#saveLog").onclick=async()=>{
  const p=parseFloat(m.querySelector("#pval").value);
  if(!isNaN(p)&&p>0){ if(!S.logs[id])S.logs[id]=[]; S.logs[id].push({p,f,d:new Date().toISOString().slice(0,10)}); if(S.logs[id].length>20)S.logs[id]=S.logs[id].slice(-20); await saveLogs(); }
  m.remove(); nextEx();
 };
 m.querySelector("#skipLog").onclick=()=>{m.remove();nextEx()};
}
window.resetAll=()=>{S={...S,screen:"lugar",lugar:null,fase:null,tiempo:null,plan:[],idx:0,serieDone:{}};render()};
window.exportProg=()=>{
 let txt="PROGRESO — Coach\n"+new Date().toLocaleDateString()+"\n\n";
 const ids=Object.keys(S.logs);
 if(!ids.length){txt+="(Aún sin registros de peso)"}
 else ids.forEach(id=>{
  const ex=EX[id]?EX[id].n:id, h=S.logs[id];
  txt+=`${ex}:\n`;
  h.forEach(u=>{txt+=`  ${u.d} · ${u.p} kg · sensación ${u.f}/5\n`});
  txt+="\n";
 });
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="sheet"><h2>Exportar progreso</h2>
  <textarea readonly style="width:100%;height:220px;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;color:var(--ink);font-size:12px;padding:10px;font-family:monospace">${txt}</textarea>
  <button class="btn" id="cp">Copiar al portapapeles</button>
  <button class="btn ghost" id="cl">Cerrar</button></div>`;
 document.body.appendChild(m);
 m.querySelector("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(txt);m.querySelector("#cp").textContent="✓ Copiado"}catch(e){m.querySelector("textarea").select()}};
 m.querySelector("#cl").onclick=()=>m.remove();
};
window.saveCfg=async()=>{const a=parseFloat(document.getElementById("mA").value),b=parseFloat(document.getElementById("mB").value);S.cfg.mA=isNaN(a)?null:a;S.cfg.mB=isNaN(b)?null:b;await saveLogs();go("lugar")};

let elState=null;
window.startElong=(k)=>{elState={zone:k,i:0};runElong()};
function runElong(){
 const z=ELONG[elState.zone], it=z.items[elState.i];
 if(!it){document.querySelector(".timerwrap")?.remove();go('elong');return}
 let w=document.querySelector(".timerwrap");
 if(!w){w=document.createElement("div");w.className="timerwrap";document.body.appendChild(w)}
 w.innerHTML=`<div class="timerlbl">${elState.i+1} de ${z.items.length}</div>
  <div style="width:200px;background:var(--panel-2);border-radius:12px;padding:8px;margin-bottom:10px">${SVGS[it[2]]||""}</div>
  <div style="font-size:20px;font-weight:800;color:var(--ink);text-align:center;padding:0 24px;margin-bottom:10px">${it[0]}</div>
  <div class="timer" id="tval">${it[1]}</div>
  <button class="timerskip" onclick="nextElong()">Siguiente →</button>
  <button class="timerskip" style="margin-top:10px;background:transparent;border-color:var(--ink-3);color:var(--ink-3)" onclick="exitElong()">✕ Salir</button>`;
 clearInterval(tInt);let t=it[1];
 tInt=setInterval(()=>{t--;const el=document.getElementById("tval");if(el)el.textContent=t;if(t<=0){nextElong()}},1000);
}
window.nextElong=()=>{clearInterval(tInt);elState.i++;runElong()};
window.exitElong=()=>{clearInterval(tInt);document.querySelector(".timerwrap")?.remove();go('elong')};

/* ====== RECUPERACIÓN: MEDITACIÓN ====== */
window.pickMedit=(k)=>{
 const v=MEDIT[k];
 app.innerHTML=`<button class="back" onclick="go('medit')">← Meditación</button><h1>${v.n}</h1><p class="sub">${v.guide}</p>
 <div class="row">${v.min.map(mn=>`<div class="opt" onclick="startMedit(${mn})"><div class="t">${mn}\u2032</div></div>`).join("")}</div>
 <p class="footer-note">Mínimo viable: 3\u2032. Consistencia &gt; duración.</p>`;
};
window.startMedit=(mn)=>{
 let secs=mn*60;
 const w=document.createElement("div");w.className="timerwrap";document.body.appendChild(w);
 const upd=()=>{const m=Math.floor(secs/60),s=secs%60;const el=document.getElementById("tval");if(el)el.textContent=`${m}:${String(s).padStart(2,"0")}`};
 w.innerHTML=`<div class="timerlbl">Meditación</div><div class="timer" id="tval">${mn}:00</div><button class="timerskip" onclick="endMedit()">Terminar</button>`;
 clearInterval(tInt);
 tInt=setInterval(()=>{secs--;upd();if(secs<=0){endMedit()}},1000);
 window.endMedit=()=>{clearInterval(tInt);document.querySelector(".timerwrap")?.remove();go('medit')};
};

/* ====== RECUPERACIÓN: RESPIRACIÓN GUIADA ====== */
window.startResp=(k)=>{
 const v=RESP[k];let ciclo=0,fase=0;
 const w=document.createElement("div");w.className="timerwrap";document.body.appendChild(w);
 function paso(){
  if(ciclo>=v.ciclos){clearInterval(tInt);w.remove();go('resp');return}
  const [txt,dur]=v.fases[fase];
  const grow=/nhala/.test(txt);const shrink=/xhala/.test(txt);
  const scale=grow?1.5:shrink?0.7:1;
  w.innerHTML=`<div class="timerlbl">Ciclo ${ciclo+1} de ${v.ciclos}</div>
   <div style="width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--agua-dk),transparent);border:3px solid var(--agua);margin:20px 0;transition:transform ${dur}s ease-in-out;transform:scale(${scale})"></div>
   <div style="font-size:24px;font-weight:800;color:var(--ink)">${txt}</div>
   <div class="timer" id="tval" style="font-size:56px">${dur}</div>
   <button class="timerskip" onclick="endResp()">Terminar</button>`;
  clearInterval(tInt);let t=dur;
  tInt=setInterval(()=>{t--;const el=document.getElementById("tval");if(el)el.textContent=t;
   if(t<=0){fase++;if(fase>=v.fases.length){fase=0;ciclo++}paso()}},1000);
 }
 window.endResp=()=>{clearInterval(tInt);document.querySelector(".timerwrap")?.remove();go('resp')};
 paso();
};

/* ====== RECUPERACIÓN: SUELO PÉLVICO ====== */
let kgState=null;
window.startKegel=(k)=>{kgState={mode:k,i:0};runKegel()};
function runKegel(){
 const z=KEGEL[kgState.mode], it=z.items[kgState.i];
 if(!it){document.querySelector(".timerwrap")?.remove();go('kegel');return}
 const on=/ontrae|prieta/.test(it[0]);
 let w=document.querySelector(".timerwrap");
 if(!w){w=document.createElement("div");w.className="timerwrap";document.body.appendChild(w)}
 const col=on?"var(--carga)":"var(--agua)";
 w.innerHTML=`<div class="timerlbl">${kgState.i+1} de ${z.items.length}</div>
  <div style="width:130px;height:130px;border-radius:50%;border:4px solid ${col};display:flex;align-items:center;justify-content:center;margin:16px 0;transition:transform .4s;transform:scale(${on?1.2:0.85})">
   <span style="font-size:22px;font-weight:800;color:${col}">${on?"▲":"▽"}</span></div>
  <div style="font-size:26px;font-weight:800;color:${col}">${it[0]}</div>
  <div class="timer" id="tval" style="font-size:56px">${it[1]}</div>
  <button class="timerskip" onclick="endKegel()">Terminar</button>
  <button class="timerskip" style="margin-top:10px;background:transparent;border-color:var(--ink-3);color:var(--ink-3)" onclick="endKegel()">✕ Salir</button>`;
 clearInterval(tInt);let t=it[1];
 tInt=setInterval(()=>{t--;const el=document.getElementById("tval");if(el)el.textContent=t;if(t<=0){kgState.i++;runKegel()}},1000);
}
window.endKegel=()=>{clearInterval(tInt);document.querySelector(".timerwrap")?.remove();go('kegel')};

loadLogs().then(render);
</script>
</body>
</html>
